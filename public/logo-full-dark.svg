<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <!-- Icon Mark Scaled into 90x90 box -->
  <g transform="translate(5, 10) scale(0.175)">
    
  <g id="leovantage-mark">
