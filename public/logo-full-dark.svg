    <path 
      d="M80 405 V175 C80 120 120 80 175 80 H395 C417 80 435 98 435 120 C435 142 417 160 395 160 H185 C171 160 160 171 160 185 V405 C160 411 155 416 149 416 H91 C85 416 80 411 80 405 Z" 
      fill="#FFFFFF"
    />

